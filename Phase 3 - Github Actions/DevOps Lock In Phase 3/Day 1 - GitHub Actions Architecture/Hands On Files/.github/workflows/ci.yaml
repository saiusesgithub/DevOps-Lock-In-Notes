name: "DevOps Lock in Phase 3 - Day 1 Workflow"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Working Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Print Custom Message
        run: echo "GitHub Actions is running successfully"

      - name: Force Failure
        run: exit 1
      
      - name: Set Variable
        run: |
          VAR=hello

      - name: Print Variable
        run: echo $VAR

  job1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello" > file.txt

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: cat file.txt